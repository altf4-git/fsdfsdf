name: Build Minecraft Mod from Zip

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE"
            rm -rf extracted_project
            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project
          else
            echo "No ZIP file found, using repository root."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        shell: bash
        run: |
          PROJECT_DIR="."

          if [ -d "extracted_project" ]; then
            PROJECT_DIR=$(find extracted_project -maxdepth 3 -name gradlew -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "No Gradle project found in the extracted zip."
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper for a compatible version..."
            gradle wrapper --gradle-version 8.8
          fi

          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamemodeswitcher-jar
          path: '**/build/libs/*.jar'
