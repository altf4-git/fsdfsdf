name: Build Minecraft Mod from Zip

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Extract Project Zip
        run: |
          # Klasördeki zip dosyasını bul ve çıkar
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Bulunan ZIP dosyasi: $ZIP_FILE"
            unzip "$ZIP_FILE" -d extracted_project
          else
            echo "ZIP dosyasi bulunamadi, mevcut dizin kullanilacak."
          fi
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build with Gradle
        run: |
          # Eğer zip çıkarıldıysa o klasörün içine gir, değilse kök dizinde kal
          if [ -d "extracted_project" ]; then
            cd extracted_project/$(ls extracted_project | head -n 1)
          fi
          
          # Gradle wrapper yoksa oluştur ve derle
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew build
          
      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamemodeswitcher-jar
          path: '**/build/libs/*.jar'
